services:
  - type: web
    name: tennisd
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --access-logfile /dev/null wsgi:app
    healthCheckPath: /healthz
    # Wait for the connected branch's CI checks before deploying.
    # The service itself remains the Render deployment target; vercel.json is
    # only a compatibility redirect for the old Vercel hostname.
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_DB
        value: "false"
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
