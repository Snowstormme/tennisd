name: Sync live top-tier matches

on:
  schedule:
    # GitHub frequently drops high-frequency cron events. Start one runner per
    # hour and let it perform four refreshes at reliable 15-minute intervals.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Feed to refresh
        required: true
        default: auto
        type: choice
        options: [auto, live, upcoming]

permissions:
  contents: read

concurrency:
  group: live-tennis-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh ATP, WTA, Challenger and ITF slate
        env:
          DATABASE_URL: ${{ secrets.TENNISD_SYNC_DATABASE_URL }}
          LIVETENNISAPI_KEY: ${{ secrets.LIVETENNISAPI_KEY }}
          AUTO_CREATE_DB: 'false'
        shell: bash
        run: |
          mode="${{ inputs.mode || 'auto' }}"
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            python scripts/sync_live_tennis.py "$mode"
            exit 0
          fi

          for refresh in 1 2 3 4; do
            python scripts/sync_live_tennis.py auto
            if [[ "$refresh" -lt 4 ]]; then
              sleep 900
            fi
          done
