name: Sync live top-tier matches

on:
  schedule:
    # GitHub can delay or drop scheduled jobs. Five-minute attempts plus the
    # database throttle below still call the provider at most every 15 minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Feed to refresh
        required: true
        default: auto
        type: choice
        options: [auto, live, upcoming]

permissions:
  contents: read

concurrency:
  group: live-tennis-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh ATP, WTA, Challenger and ITF slate
        env:
          DATABASE_URL: ${{ secrets.TENNISD_SYNC_DATABASE_URL }}
          LIVETENNISAPI_KEY: ${{ secrets.LIVETENNISAPI_KEY }}
          AUTO_CREATE_DB: 'false'
        run: python scripts/sync_live_tennis.py "${{ inputs.mode || 'auto' }}"
