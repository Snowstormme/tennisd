name: Sync live top-tier matches

on:
  schedule:
    # One daily refresh keeps Neon mostly idle while preserving a current and
    # seven-day upcoming slate without requiring the owner's laptop.
    - cron: '7 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Feed to refresh
        required: true
        default: auto
        type: choice
        options: [auto, live, upcoming]

permissions:
  contents: read

concurrency:
  group: live-tennis-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh ATP, WTA, Challenger and ITF slate once
        env:
          DATABASE_URL: ${{ secrets.TENNISD_SYNC_DATABASE_URL }}
          LIVETENNISAPI_KEY: ${{ secrets.LIVETENNISAPI_KEY }}
          AUTO_CREATE_DB: 'false'
        run: python scripts/sync_live_tennis.py "${{ inputs.mode || 'auto' }}"
