name: Preview catalog recovery

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum records to review (1–50); at most one provider call per record
        type: string
        default: '10'
        required: true

permissions:
  contents: read

concurrency:
  group: catalog-recovery-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepare proposals in a database-enforced read-only transaction
        env:
          DATABASE_URL: ${{ secrets.TENNISD_SYNC_DATABASE_URL }}
          LIVETENNISAPI_KEY: ${{ secrets.LIVETENNISAPI_KEY }}
          AUTO_CREATE_DB: 'false'
          PREVIEW_LIMIT: ${{ inputs.limit }}
        run: python scripts/plan_catalog_recovery.py --limit "$PREVIEW_LIMIT" > catalog-recovery-plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: catalog-recovery-plan-${{ github.run_id }}
          path: catalog-recovery-plan.json
          if-no-files-found: error
          retention-days: 14
