name: Expand tennis database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tennis-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Add normalized catalog schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_OWNER_URL }}
        run: |
          python - <<'PY'
          import os, re
          import psycopg
          url = re.sub(r'^postgresql\+[^:]+://', 'postgresql://', os.environ['DATABASE_URL'])
          with psycopg.connect(url) as connection:
              connection.execute(open('scripts/expand_tennis_database.sql').read())
          PY
