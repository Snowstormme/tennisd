name: Initialize production database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_OWNER_URL }}
          AUTO_CREATE_DB: "false"
        run: flask --app wsgi init-db
      - name: Restrict and verify application database role
        env:
          DATABASE_URL: ${{ secrets.DATABASE_OWNER_URL }}
          DATABASE_APP_PASSWORD: ${{ secrets.DATABASE_APP_PASSWORD }}
        run: python scripts/apply_database_security.py
