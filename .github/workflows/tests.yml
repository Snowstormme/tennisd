name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - run: python -m unittest discover -s tests -v

  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tennisd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tennisd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tennisd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. python scripts/postgres_smoke.py

  backup-restore-smoke:
    runs-on: ubuntu-latest
    container: postgres:18-bookworm
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tennisd_source
        options: >-
          --health-cmd "pg_isready -U postgres -d tennisd_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Verify dump, restore, and refusal to overwrite an existing database
        shell: bash
        run: |
          set -euo pipefail
          source='postgresql://postgres:postgres@postgres:5432/tennisd_source?sslmode=disable'
          createdb -h postgres -U postgres tennisd_restore
          psql "$source" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public."user" (id integer PRIMARY KEY);
          CREATE TABLE public.match (id integer PRIMARY KEY);
          CREATE TABLE public.review (user_id integer REFERENCES public."user", match_id integer REFERENCES public.match, body text);
          INSERT INTO public."user" VALUES (1);
          INSERT INTO public.match VALUES (1);
          INSERT INTO public.review VALUES (1, 1, 'Backup smoke note');
          SQL
          pg_dump "$source" --format=custom --no-owner --no-acl --file=/tmp/test.dump
          bash scripts/verify_backup.sh /tmp/test.dump
          restored=$(psql 'postgresql://postgres:postgres@postgres:5432/tennisd_restore?sslmode=disable' -At -c "SELECT count(*) FROM public.review WHERE body='Backup smoke note'")
          test "$restored" = '1'
          if bash scripts/verify_backup.sh /tmp/test.dump; then
            echo 'Unexpectedly accepted a nonempty restore destination' >&2
            exit 1
          fi

  required-tests:
    # Preserve the protected branch's existing required check name while
    # requiring both Python versions, PostgreSQL and restore verification.
    name: test
    if: always()
    needs: [test, postgres-smoke, backup-restore-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to pass
        env:
          UNIT_RESULT: ${{ needs.test.result }}
          POSTGRES_RESULT: ${{ needs.postgres-smoke.result }}
          BACKUP_RESULT: ${{ needs.backup-restore-smoke.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$POSTGRES_RESULT" = success
          test "$BACKUP_RESULT" = success
