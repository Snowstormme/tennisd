name: Notify search engines

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install IndexNow client dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Submit current Render URLs to IndexNow
        env:
          PUBLIC_HOST: tennisd.onrender.com
        run: python scripts/submit_indexnow.py
