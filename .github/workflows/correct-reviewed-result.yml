name: Correct a reviewed result

on:
  workflow_dispatch:
    inputs:
      correction:
        description: Select a version-controlled reviewed result or bounded group
        type: choice
        default: itf-sharm-2026-030-kirci-yuan
        options:
          - itf-sharm-2026-030-kirci-yuan
          - us-open-2024-machac-fognini
          - us-open-2024-humbert-monteiro
          - fognini-2024-archive
          - fognini-2024-rounds
        required: true
      operation:
        description: Preview first; apply or roll back the selected reviewed correction
        type: choice
        default: preview
        options: [preview, apply, rollback]
        required: true

permissions:
  contents: read

concurrency:
  group: live-tennis-sync
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Guard and record the reviewed result or group
        env:
          DATABASE_URL: ${{ secrets.TENNISD_SYNC_DATABASE_URL }}
          AUTO_CREATE_DB: 'false'
          CORRECTION_OPERATION: ${{ inputs.operation }}
          CORRECTION_ID: ${{ inputs.correction }}
        run: python scripts/correct_reviewed_result.py "$CORRECTION_ID" --operation "$CORRECTION_OPERATION" > reviewed-result-correction.json
      - uses: actions/upload-artifact@v7
        with:
          name: reviewed-result-correction-${{ github.run_id }}
          path: reviewed-result-correction.json
          if-no-files-found: error
          retention-days: 30
