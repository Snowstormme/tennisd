name: Repair live match archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recheck a bounded set of results without deleting diary entries
        env:
          DATABASE_URL: ${{ secrets.TENNISD_SYNC_DATABASE_URL }}
          AUTO_CREATE_DB: 'false'
          LIVETENNISAPI_KEY: ${{ secrets.LIVETENNISAPI_KEY }}
        run: python scripts/repair_live_archive.py
